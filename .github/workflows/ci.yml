name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # D4: PII-grep — вопрос/толкование никогда не уходят в аналитику
      - run: test -z "$(grep -rn 'track(events\.[a-zA-Z]*, {[^}]*\(question\|interpretation\)' lib app components || true)"
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_URL: https://ci.local
          NEXT_PUBLIC_POSTHOG_KEY: ci-disabled

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taro
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: taro
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U taro"
          --health-interval=5s --health-timeout=5s --health-retries=5
      cache:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgres://taro:ci-only@localhost:5432/taro?sslmode=disable
      REDIS_ADDR: localhost:6379
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      # D2: схема для e2e-тестов (миграции по порядку, как deploy/migrate.sh)
      - run: >
          docker run --rm --network host
          -v ${{ github.workspace }}/api/migrations:/migrations
          migrate/migrate:v4.18.2
          -path /migrations
          -database "postgres://taro:ci-only@localhost:5432/taro?sslmode=disable" up
      # D2: тесты гоняются всегда; e2e со Skip получают сервисы выше и НЕ скипаются в CI
      - run: go test -race -count=1 ./...

  security:
    # S09: секреты и .env никогда не попадают в git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test ! -e .env || (echo ".env committed!" && exit 1)
      - run: test -z "$(grep -rn '11FvQdiQe2RUimQe1i3NtUZ4l3P9nzep71YYI96e5Oo' --exclude-dir=.git . || true)"
      - run: test -z "$(git ls-files | grep -E '(^|/)\.env$' || true)"
      # Реестр исключений двусторонний (аудит D): код→yml и yml→код.
      # РЕШЕНО-записи живут только в closed: ниже. Сканим код, не сам реестр.
      - run: |
          for id in $(grep -rh 'AUDIT-EXCEPTION' api web deploy docker-compose.yml .env.example | grep -oE 'E[0-9]+' | sort -u); do
            grep -q "id: $id" docs/security-exceptions.yml || (echo "exception $id без записи в yml!" && exit 1)
          done
          python3 - <<'EOF'
          import re, sys, subprocess
          yml = open("docs/security-exceptions.yml").read()
          active = yml.split("closed:")[0] if "closed:" in yml else yml
          ids_yml = set(re.findall(r"id: (E\d+)", active))
          code = subprocess.run(["grep", "-rh", "AUDIT-EXCEPTION", "api", "web", "deploy", "docker-compose.yml", ".env.example"],
                                 capture_output=True, text=True).stdout
          ids_code = set(re.findall(r"E\d+", code))
          bad = ids_yml - ids_code
          if bad:
              print("exceptions без маркера в коде:", sorted(bad))
              sys.exit(1)
          print("exceptions OK bidirectional")
          EOF
      # Fail-open флаги dev-авторизации — никогда в прод-конфигах (только код default-off + тесты)
      - run: |
          test -z "$(grep -rn 'TG_ALLOW_EMPTY=1\|TG_ALLOW_DEV_BOT=1' docker-compose.yml deploy/ .github/ .env.example 2>/dev/null || true)" \
            || (echo "dev-auth flag в прод-конфиге!" && exit 1)
