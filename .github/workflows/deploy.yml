name: deploy

# Деплой на VPS по тегу v* (см. T30, 10-appendices/03, S10).
# Релиз только до 18:00 МСК (пик 20:00–01:00) — workflow ПРОВЕРЯЕТ время и падает после.
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY.
# На VPS один раз: git clone, env с секретами (JWT_SECRET, TG_BOT_TOKEN,
# TG_STARS_SECRET_TOKEN, OPENROUTER_API_KEY, POSTGRES_PASSWORD, ADMIN_API_TOKEN,
# ADMIN_TG_IDS), UFW (см. deploy/README.md).

on:
  push:
    tags:
      - "v*"

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            HOUR=$(TZ=Europe/Moscow date +%H)
            if [ "$HOUR" -ge 18 ]; then echo "STOP: deploy after 18:00 MSK forbidden"; exit 1; fi
            cd /opt/taro
            git fetch --tags
            git checkout ${{ github.ref_name }}
            export $(grep -v '^#' .env 2>/dev/null | xargs) || true
            ./deploy/migrate.sh up
            docker compose build
            docker compose up -d
            sleep 10
            curl -f http://localhost/healthz || curl -f http://localhost/
            curl -f http://localhost/v1/spreads
            docker compose exec -T db psql -U taro -d taro -c "SELECT COUNT(*) FROM spreads WHERE is_active;"
            if ss -tlnp | grep -E ':8081.*0\.0\.0\.0'; then echo "FAIL: 8081 public!"; exit 1; fi
            echo "admin 8081 not public (ok)"
