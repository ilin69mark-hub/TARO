name: deploy

# Деплой на VPS по тегу v* (см. T30, 10-appendices/03).
# Только до 18:00 МСК запускать (пик 20:00–01:00)! Workflow не проверяет время —
# смотри на часы перед релизом тега.
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY.
# На VPS один раз: git clone, .env с секретами (JWT_SECRET, TG_BOT_TOKEN,
# TG_STARS_SECRET_TOKEN, OPENROUTER_API_KEY, POSTGRES_PASSWORD), UFW (см. deploy/README.md).

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd /opt/taro
            git fetch --tags
            git checkout ${{ github.ref_name }}
            ./deploy/migrate.sh up
            docker compose build
            docker compose up -d
            docker compose exec -T db psql -U taro -d taro -c "SELECT COUNT(*) FROM spreads WHERE is_active;"
            ss -tlnp | grep 8081 || echo "admin port check: 8081 not public (ok)"
