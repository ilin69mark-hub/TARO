services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: taro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taro_dev_only}
      POSTGRES_DB: taro
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
      - dev-access
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taro -d taro"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  cache:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -ec
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - internal
      - dev-access
    ports:
      - "127.0.0.1:${CACHE_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api-public:
    build:
      context: ./api
      dockerfile: Dockerfile.public
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://taro:${POSTGRES_PASSWORD:-taro_dev_only}@db:5432/taro?sslmode=disable}
      REDIS_ADDR: cache:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_ENC_KEY: ${REDIS_ENC_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_KEY_2: ${OPENROUTER_API_KEY_2:-}
      AI_REQUIRE_CACHE_ENCRYPTION: ${AI_REQUIRE_CACHE_ENCRYPTION:-}
      AI_WORKER_MAX_ATTEMPTS: ${AI_WORKER_MAX_ATTEMPTS:-5}
      AI_WORKER_BACKOFF_SECONDS: ${AI_WORKER_BACKOFF_SECONDS:-30}
      AI_WORKER_MAX_BACKOFF_SECONDS: ${AI_WORKER_MAX_BACKOFF_SECONDS:-900}
      CRISIS_PATTERNS_JSON: ${CRISIS_PATTERNS_JSON:-}
      CRISIS_RESOURCE_TEXT: ${CRISIS_RESOURCE_TEXT:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-dev-only-bot}
      TG_STARS_SECRET_TOKEN: ${TG_STARS_SECRET_TOKEN:-dev-only-stars}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - internal
      - edge
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256

  api-admin:
    build:
      context: ./api
      dockerfile: Dockerfile.admin
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://taro:${POSTGRES_PASSWORD:-taro_dev_only}@db:5432/taro?sslmode=disable}
      REDIS_ADDR: cache:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-dev-only-bot}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://127.0.0.1:${ADMIN_HOST_PORT:-8081}}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMIN_HOST_PORT:-8081}:8082"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/readyz >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128

  admin-access:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    network_mode: service:api-admin
    volumes:
      - ./deploy/admin-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/admin-ui:/usr/share/nginx/html:ro
    depends_on:
      api-admin:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api-public:8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
    depends_on:
      api-public:
        condition: service_healthy
    networks:
      - edge
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api-public:
        condition: service_healthy
    networks:
      - edge
    ports:
      - "80:80"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - NET_RAW
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrate:
    image: migrate/migrate:v4.18.2@sha256:acded13a336f2b6f35fd9ce14a32834cf1e6b2a7887fe5dfc977b3e563eba39e
    profiles:
      - migration
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./api/migrations:/migrations:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taro_dev_only}
      MIGRATE_COMMAND: ${MIGRATE_COMMAND:-up}
      MIGRATE_STEPS: ${MIGRATE_STEPS:-}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    entrypoint:
      - sh
      - -ec
    command:
      - |
        if [ -z "$${DATABASE_URL:-}" ]; then
          if [ -z "$${POSTGRES_PASSWORD:-}" ]; then
            printf '%s\n' 'DATABASE_URL or POSTGRES_PASSWORD is required' >&2
            exit 1
          fi
          DATABASE_URL="postgres://taro:$${POSTGRES_PASSWORD}@db:5432/taro?sslmode=disable"
          export DATABASE_URL
        fi
        if [ -n "$${MIGRATE_STEPS:-}" ]; then
          exec migrate -path /migrations -database "$${DATABASE_URL}" "$${MIGRATE_COMMAND}" "$${MIGRATE_STEPS}"
        fi
        exec migrate -path /migrations -database "$${DATABASE_URL}" "$${MIGRATE_COMMAND}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64

  schema-check:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    profiles:
      - migration
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taro_dev_only}
      EXPECTED_MIGRATION_VERSION: ${EXPECTED_MIGRATION_VERSION:-0}
      SCHEMA_READINESS_MODE: ${SCHEMA_READINESS_MODE:-schema}
      MIGRATION_PREFLIGHT: ${MIGRATION_PREFLIGHT:-0}
      MIGRATION_DOWN_STEPS: ${MIGRATION_DOWN_STEPS:-}
      MIGRATION_LATEST_VERSION: ${MIGRATION_LATEST_VERSION:-0}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - ./deploy/schema-ready.sh:/check.sh:ro
    entrypoint:
      - sh
      - /check.sh
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64

networks:
  internal:
  dev-access:
  edge:

volumes:
  pgdata:
  redisdata:
