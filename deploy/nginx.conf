# nginx — единая точка входа. 8081 (admin) наружу НЕ публикуется (см. Книгу 04-architecture/01).
# Явный deny-блок ниже + UFW + отсутствие ports у api-admin (см. S10).
# TLS: терминируется на VPS (certbot) — см. deploy/README.md; здесь listen 80 + security headers.
# Проверка: ss -tlnp показывает 8081 только на 127.0.0.1; curl извне → timeout.

upstream web {
  server web:3000;
}

upstream api_public {
  server api-public:8080;
}

# Rate limits — единый источник: docs/project-book/04-architecture/04-api-spec.md
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=readings:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=spreads:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=payments:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=diary:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
# Аудит C: OG-рендер CPU-тяжёлый и публичный — отдельная жёсткая зона.
limit_req_zone $binary_remote_addr zone=og:10m rate=10r/m;

# S10: 8081 слушать не на что — явный deny на случай ошибочного expose
server {
  listen 8081 default_server;
  return 444;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 1m;

  # S10: базовые security headers (+ CSP как в next.config.js; HSTS — после TLS, см. E08)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://eu.posthog.com; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
  # HSTS — включать ТОЛЬКО после настройки TLS на VPS (см. deploy/README.md)!
  # add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    proxy_pass http://web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Аудит C: /api/og — публичный CPU-рендер (ImageResponse 1200×630): жёсткий лимит.
  # + Cache-Control от Next (public 24h) — повторные хиты не жгут CPU.
  location = /api/og {
    limit_req zone=og burst=5 nodelay;
    proxy_pass http://web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v1/auth/ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://api_public;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # S10: SSE без буферизации, иначе стрим висит/рвется
  location = /v1/readings {
    limit_req zone=readings burst=5 nodelay;
    proxy_pass http://api_public;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v1/readings {
    limit_req zone=readings burst=5 nodelay;
    proxy_pass http://api_public;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v1/spreads {
    limit_req zone=spreads burst=20 nodelay;
    proxy_pass http://api_public;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v1/payments/ {
    limit_req zone=payments burst=5 nodelay;
    proxy_pass http://api_public;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v1/diary {
    limit_req zone=diary burst=10 nodelay;
    proxy_pass http://api_public;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Аудит D: перебор referral-кодов — отдельный лимит (в Go тоже, см. ratelimit).
  location /v1/referral/ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://api_public;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v1/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://api_public;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Админки здесь нет намеренно: /v1/admin/* — только 127.0.0.1:8081 + SSH-туннель (см. 04-architecture/02).
}
