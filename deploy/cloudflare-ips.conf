# Адреса Cloudflare, которым мы верим при разборе реального IP посетителя.
#
# ГЕНЕРИРУЕТСЯ ФАЙЛОМ, НЕ ПРАВИТЬ РУКАМИ:
#   sh deploy/update-cf-ips.sh
# Источник: https://www.cloudflare.com/ips-v4 и /ips-v6 (официальный список).
#
# ЗАЧЕМ ЭТО НУЖНО (D9).
#
# nginx по умолчанию берёт адрес из соединения — $remote_addr. Пока перед нами
# только Cloudflare, это правильный адрес посетителя, и лимиты работают честно.
# Но как только Cloudflare поставится (E04), соединение будет устанавливать
# Cloudflare, а не человек. Тогда $remote_addr станет адресом Cloudflare —
# ОДНИМ И ТЕМ ЖЕ для всех посетителей, и:
#   • limit_req (60/мин на /v1/spreads) начнёт делить ВСЯ аудитория: один
#     человек перегрузил страницу — 429 получили все остальные;
#   • антифера рефералки (antifarm_ip) начнёт считать, что все приглашения
#     пришли с одного адреса, и отклонять честных людей.
#
# real_ip_header говорит «адрес бери из этого заголовка», а set_real_ip_from
# говорит «доверяй этому заголовку ТОЛЬКО для соединений из этих сетей».
# Второе — то, что делает схему безопасной: без него любой желающий подставил бы
# CF-Connecting-IP и обошёл бы все IP-лимиты.
#
# Пока Cloudflare не поставлен, файл безвреден: трафика из этих сетей нет, и
# real_ip_header просто не срабатывает. Именно поэтому настройка идёт ДО E04:
# после установки Cloudflare, если забыть этот файл, поломка обнаружится
# сразу в проде.
# Всего сетей: 15 IPv4 + 7 IPv6

